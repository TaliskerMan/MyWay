include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    dead_code: error
    unused_element: warning
    unused_field: warning
    unused_local_variable: warning
    # CP-ChangeComments (2026-11-27, v1.0.2+6): Flutter 3.50.1 (>= 3.47.0-0.0.pre)
    # marks the standard `package:flutter/material.dart` barrel deprecated in favor of
    # `package:material_ui/material_ui.dart`, which is not yet supported by SonarQube
    # Cloud's Dart analyzer; verified zero non-barrel deprecated usages in lib/ or test/.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - linux/**
    - packaging/**
    - Audit/**
    - docs/**
    - .dart_tool/**
    - "**/node_modules/**"
linter:
  rules:
    - close_sinks
    - cancel_subscriptions
